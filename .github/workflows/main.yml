name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与强制混淆手术
        run: |
          # 1. 移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 核心修改：强制关闭 debuggable 并开启极致优化
          # [span_8](start_span)[span_9](start_span)这会消除日志中的 WARNING，强制 R8 执行混淆[span_8](end_span)[span_9](end_span)
          sed -i '/buildTypes {/a \        all { \n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入混淆规则
          cat <<EOF > app/proguard-rules.pro
          # 允许混淆和优化
          -optimizationpasses 5
          -allowaccessmodification
          
          # 必须保留 Python 接口 (Chaquopy)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature
          
          # 保留数据模型，防止解析失效
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 忽略第三方库警告
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 4. 校准环境
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_Mixed_Build
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
