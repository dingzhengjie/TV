name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与强制混淆手术
        run: |
          # 1. 彻底移除签名配置，防止构建中断
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 强力注入：直接在 buildTypes 块之后强制开启全局混淆与压缩
          # 这样可以确保不论是 debug 还是 release，都会执行 R8 剔除
          sed -i '/buildTypes {/a \        all { \n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入极限混淆规则：除了 Python 环境，其他全部混淆
          cat <<EOF > app/proguard-rules.pro
          # 开启四级优化
          -optimizationpasses 4
          -allowaccessmodification
          -overloadaggressively
          
          # 必须保留：Chaquopy Python 环境 (否则脚本必崩)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature
          
          # 必须保留：数据模型和 JS 接口 (防止 JSON 解析失败)
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 剩下的全混淆：包括你图片里的 androidx, okhttp, rtmp_client 等
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 4. 校准环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建 (多 DEX 合并版)
        # 使用 assembleDebug 触发我们刚刚注入的全局压缩逻辑
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Compressed_Build
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
