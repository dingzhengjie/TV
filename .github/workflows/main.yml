name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简手术
        run: |
          # 1. 彻底物理移除签名配置，防止 Release 强制校验导致失败
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入生产环境优化逻辑：开启压缩，精简资源
          sed -i '/release {/a \            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' app/build.gradle
          
          # 3. 【核心】写入专项 Proguard 规则，解决 1.txt 中的崩溃问题
          cat <<EOF > app/proguard-rules.pro
          # 必须保留 Chaquopy (Python) 核心，否则编译会报错并闪退
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 保留 TVBox 关键 Bean 和 JS 桥接，确保解析正常
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 忽略所有警告 (解决 CompilationFailedException 的关键)
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 4. 环境路径校准
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建生产版本
        # 使用 assembleRelease 构建，产物将不再有 30 多个 DEX
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Release_Single_DEX
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
