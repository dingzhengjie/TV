name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与代码手术 (极致压缩与混淆)
        run: |
          # 1. 物理移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 启用 MultiDex 并开启 R8 混淆
          sed -i 's/multiDexEnabled false/multiDexEnabled true/g' app/build.gradle
          
          # 3. 注入混淆与资源压缩配置
          sed -i '/debug {/a \            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' app/build.gradle
          
          # 4. 写入保护规则
          cat <<EOF > app/proguard-rules.pro
          -optimizationpasses 5
          -allowaccessmodification
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          -keepclasseswithmembernames class * { native <methods>; }
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 5. 配置环境
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建
        run: ./gradlew assembleDebug --no-daemon

      # 关键修改：将文件移动到一个平级目录，并分别上传
      - name: 整理 APK 文件
        run: |
          mkdir -p final_apks
          # 寻找所有生成的 apk 并复制到根目录，重命名以区分变体
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} final_apks/ \;

      - name: 独立上传每个 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_APKs
          path: final_apks/*.apk
          if-no-files-found: error
