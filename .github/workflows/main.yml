name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极限优化手术
        run: |
          # 1. 彻底移除签名配置，虽然是生产环境，但我们仍使用调试签名以防报错
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 修改 release 配置，开启极限压缩
          # 强制将所有变体的 release 模式开启 minifyEnabled 和 shrinkResources
          sed -i '/release {/a \            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' app/build.gradle
          
          # 3. 写入关键保护规则 (防止混淆导致 Python 或数据模型崩溃)
          cat <<EOF > app/proguard-rules.pro
          -optimizationpasses 5
          -keep class com.chaquo.python.** { *; }
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature
          -ignorewarnings
          EOF
          
          # 4. 环境路径配置
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行生产环境编译
        # 使用 assembleRelease 编译生产版本
        run: ./gradlew assembleRelease --no-daemon

      - name: 提取并独立上传每个 APK
        # 这个步骤会将每个生成的 APK 以独立文件形式上传
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Release_Final
          path: app/build/outputs/apk/**/release/*.apk
