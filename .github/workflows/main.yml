name: Build Android APK

on:
  workflow_dispatch:

# 解决 Node.js 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与代码手术
        run: |
          # 在 settings.gradle 中插入 Chaquopy 仓库地址
          sed -i '/repositories {/a \        maven { url "https://chaquo.com/maven" }' settings.gradle
          
          # [span_4](start_span)原有的 Python 路径配置[span_4](end_span)
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          
          # [span_5](start_span)补齐 SDK 路径[span_5](end_span)
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          # 你原有的逻辑
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle

          
          # 2. 指定 Chaquopy 的 Python 路径[span_4](start_span)[span_4](end_span)
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          
          # 3. 补齐 SDK 配置文件
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 生产模式构建
        # 记得先在 build.gradle 处理签名，或使用此命令跳过正式签名（仅限测试）
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Release_Build
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
