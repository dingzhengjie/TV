name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简手术 (兼容 Gradle 9.3+)
        run: |
          # 1. 物理移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入配置：解决报错，强制使用 optimize 文件名
          # 开启精简 (minifyEnabled) 以合并 DEX，但关闭资源缩减防止崩溃
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“终极稳定版”规则：禁用混淆 + 禁用优化 + 保护业务类
          cat <<EOF > app/proguard-rules.pro
          # 【核心】彻底禁用类名混淆，解决图片中 te1 报错
          -dontobfuscate
          
          # 【核心】手动禁用优化，满足 Gradle 9.3 要求的同时防止闪退和 R8 崩溃
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 1. 保护 Python 运行时 (Chaquopy)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 2. 强制保护所有业务包不被精简，确保投屏和解析稳定
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          
          # 3. 专项修复：保留所有单字符串构造函数
          -keepclassmembers class * {
              public <init>(java.lang.String);
              public <init>(android.content.Context, android.util.AttributeSet);
          }
          
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 配置环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行生产环境构建
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_Stable_Release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
