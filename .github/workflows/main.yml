name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简手术 (稳定防闪退版)
        run: |
          # 1. 物理移除签名配置，防止 release 模式中断
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入配置：开启缩减 (minifyEnabled) 以合并 DEX，但关闭资源精简和优化以防 R8 崩溃
          # 强制设置 debuggable false 以生成生产环境安装包
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“保命级”规则：禁止混淆 + 强制保留所有业务类
          cat <<EOF > app/proguard-rules.pro
          # 【核心】彻底禁用类名混淆，解决图片中 te1 这种找不到类的问题
          -dontobfuscate
          
          # 【核心】彻底禁用代码优化，防止 R8 内部索引报错 (IndexOutOfBoundsException)
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 1. 保护 Python 运行时 (Chaquopy)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 2. 强制保留所有业务逻辑包 (不混淆、不精简)
          # 这样 R8 就不会动你的投屏、解析等核心逻辑
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          
          # 3. 专项修复：保留所有单字符串构造函数 (解决图片报错的关键)
          -keepclassmembers class * {
              public <init>(java.lang.String);
              public <init>(android.content.Context, android.util.AttributeSet);
          }
          
          # 忽略第三方库的细碎警告
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 配置环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行生产环境构建
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Pro_Stable_Release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
