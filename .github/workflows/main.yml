name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简手术
        run: |
          # 1. 物理移除签名配置，防止 release 构建中断
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入配置：开启 minify 以合并 31 个 DEX，但关闭资源缩减以防报错
          # 使用 proguard-android-optimize.txt 满足 Gradle 9.3 要求
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“绝对不闪退”的精简规则
          cat <<EOF > app/proguard-rules.pro
          # 【核心】禁止重命名类名：彻底解决 te1 这种反射报错，确保不闪退
          -dontobfuscate
          
          # 【核心】禁用激进优化：防止逻辑重写导致的运行异常
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 保护所有业务包：即使精简，也不要动核心代码
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          -keep class com.chaquo.python.** { *; }
          
          # 属性保护：保留反射所需的注解和签名
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 针对之前报错的专项加固：保留所有类的单字符串构造函数
          -keepclassmembers class * {
              public <init>(java.lang.String);
          }
          
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 补齐 SDK 与 Python 环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行正式版构建
        # 运行 assembleRelease 任务
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_Lite_Version
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
