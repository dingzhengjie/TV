name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 极速压缩手术 (只合并DEX，不优化不混淆)
        run: |
          # 1. 移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入配置：开启缩减以合并 DEX，但禁用冗长的优化和资源缩减
          sed -i '/buildTypes {/a \        all { \n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“极速版”混淆规则
          cat <<EOF > app/proguard-rules.pro
          # 【提速核心】禁用最耗时的步骤：混淆类名和代码优化
          -dontobfuscate
          -dontoptimize
          -dontpreverify
          
          # 忽略警告（减少日志输出也能提速）
          -ignorewarnings
          -dontnote **
          -dontwarn **
          
          # 必须保留的业务代码 (防止被误删导致闪退)
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          -keep class com.chaquo.python.** { *; }
          
          # 属性保护
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 专项加固构造函数
          -keepclassmembers class * {
              public <init>(java.lang.String);
          }
          EOF
          
          # 4. 补齐 SDK 与环境 (延续 main.txt.txt 逻辑)
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行极速构建
        # 使用 --parallel 开启并行编译进一步提速
        run: ./gradlew assembleDebug --no-daemon --parallel --max-workers=4

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Lite_Fast_Build
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
