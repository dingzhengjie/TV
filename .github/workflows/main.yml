name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 极致精简手术 (只合并DEX，不混淆)
        run: |
          # 1. 物理移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 核心修改：开启 minify(压缩) 但强制关闭混淆
          # 针对 Gradle 9.3 必须使用 proguard-android-optimize.txt，我们在规则里手动禁优化
          sed -i '/buildTypes {/a \        all { \n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“只精简、不改名”的保命 Proguard 规则
          cat <<EOF > app/proguard-rules.pro
          # 【最关键】禁止混淆：保留所有原始类名，解决 te1 闪退报错
          -dontobfuscate
          
          # 稳定性：禁用字节码优化，防止 R8 内部索引越界崩溃
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 必须保留：Chaquopy Python 环境
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 强制保护业务包，确保投屏和解析模块逻辑完整
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          
          # 专项加固：保留反射所需的单字符串构造函数
          -keepclassmembers class * {
              public <init>(java.lang.String);
          }
          
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 补齐 SDK 与 Python 路径 (延续 main.txt.txt 中的逻辑)
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行强力构建
        # 这里会针对所有变体应用 minify，合并 DEX
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Lite_NoObfuscate
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
