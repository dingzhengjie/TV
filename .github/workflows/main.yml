name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与生产环境手术
        run: |
          # 1. 物理移除签名配置，防止 release 模式强制校验签名
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 确保 release 模式开启了压缩，但使用更稳健的规则
          # 这样能把 30 多个 DEX 压到 2-3 个
          sed -i '/release {/a \            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' app/build.gradle
          
          # 3. 【关键】写入生产环境保护规则，解决 1.txt 里的编译报错
          cat <<EOF > app/proguard-rules.pro
          # 解决 Chaquopy 报错：必须保留 Python 所有的核心类
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 解决 TVBox 逻辑报错：保留数据模型和 JS 桥接
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 忽略所有警告，防止 R8 因为找不到某些无关紧要的引用而中断编译
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 4. 指定 Python 路径（修复日志中的路径报错）
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行生产环境构建
        # 编译 Release 版本，产物会比 Debug 版小很多
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传生产环境 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Release_Final
          # 匹配所有 release 目录下的 APK
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
