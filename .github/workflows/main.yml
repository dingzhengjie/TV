name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境稳定性修复手术
        run: |
          # 1. 物理移除签名配置，解决 null 报错
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入生产环境配置：开启极致压缩，但关闭不稳定的资源缩减 (防止 IndexOutOfBounds 崩溃)
          # 强制设置 debuggable false 确保混淆生效
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“最强兼容”混淆规则 (解决闪退的核心)
          cat <<EOF > app/proguard-rules.pro
          # 基础：关闭激进优化，保证老旧电视硬件兼容
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 核心保护：Chaquopy Python 环境 (防止 Python 逻辑崩溃)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 核心保护：修复投屏 (DLNA) 和核心业务闪退
          # 保护 com.fongmi 等包下的所有类名不被修改
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          
          # 修复反射构造报错 (解决 class te1 这种找不到构造函数的闪退)
          -keepclassmembers class * {
              public <init>(java.lang.String);
              public <init>(android.content.Context, android.util.AttributeSet);
          }
          
          # 核心保护：TVBox 数据模型与 JS 桥接 (防止解析视频源闪退)
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 忽略第三方库的琐碎警告
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 补齐 SDK 与环境配置文件
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建生产版本
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_Stable_Release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
