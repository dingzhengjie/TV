name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与强制全量混淆手术
        run: |
          # 1. 彻底移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 全局劫持：强制所有变体开启极致混淆
          # 必须使用 proguardFiles 的 optimize 版本来获得最高强度的类名粉碎
          sed -i '/buildTypes {/a \        all { \n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“粉碎级”混淆规则
          cat <<EOF > app/proguard-rules.pro
          # 显式要求开启混淆
          -obfuscationdictionary
          -classobfuscationdictionary
          -packageobfuscationdictionary
          
          # 极致优化设置
          -optimizationpasses 5
          -allowaccessmodification
          -overloadaggressively
          -repackageclasses ''
          
          # 【核心：删掉这一行或确保没有 -dontobfuscate】
          # 如果之前有 -dontobfuscate，现在必须消失
          
          # 必须保留的：Chaquopy Python 环境
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 必须保留的：TVBox 核心数据模型
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 剩下的：androidx, okhttp, rtmp 等全部会被粉碎成 a, b, c
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 4. 校准环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Full_Obfuscated_Build
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
