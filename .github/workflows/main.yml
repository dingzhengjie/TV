name: Build Android APK

on:
  workflow_dispatch:

# 解决 Node.js 20 弃用警告，强制使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        # Chaquopy 编译必须指定 3.10 版本
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与精简手术
        run: |
          # 1. 物理移除所有签名配置 (核心：解决之前的 null 报错和签名冲突)
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入混淆配置到 Debug 模式 (核心：在 Debug 任务中强制压缩 DEX)
          # 开启 minifyEnabled 来剔除无用代码，这是减少 DEX 数量的唯一办法
          sed -i '/debug {/a \            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"' app/build.gradle
          
          # 3. 写入针对 Chaquopy 和 TVBox 的专用 Proguard 规则
          # 既要合并 DEX，又要保证 Python 脚本不崩溃
          cat <<EOF > app/proguard-rules.pro
          # 基础设置：不混淆类名，但允许压缩 (解决 30 多个 DEX 的问题)
          -dontobfuscate
          -dontoptimize
          -ignorewarnings
          
          # 保留 Python 环境核心接口
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature
          
          # 保留 TVBox 关键 Bean 和 JS 桥接，确保解析正常
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 校准环境路径 (修复 1.txt 中的 Python 找不到报错)
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建
        # 使用 assembleDebug 任务，但在预处理中我们已经注入了压缩逻辑
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Optimized_Build
          # 匹配所有编译出的变体 APK
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
