name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简手术 (零混淆版)
        run: |
          # 1. 物理移除签名配置，防止 release 模式中断
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入生产环境配置：开启精简 (minifyEnabled)，但关闭资源缩减 (防止 R8 崩溃)
          # 强制设置 debuggable false 以生成正式安装包
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“只压缩、不改名”的保命规则 (解决闪退的核心)
          cat <<EOF > app/proguard-rules.pro
          # 【关键】禁用混淆：保留所有原始类名，彻底解决 te1 这种报错
          -dontobfuscate
          
          # 稳定性设置：禁用激进优化，防止 R8 内部索引报错
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 必须保留：Chaquopy Python 环境
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 保护所有业务代码，防止被 R8 误判为无用代码而删掉
          -keep class com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          
          # 针对图片报错：保护所有单字符串构造函数
          -keepclassmembers class * {
              public <init>(java.lang.String);
          }
          
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 配置环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行生产环境构建
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Production_Final
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
