name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简与防闪退手术
        run: |
          # 1. 物理移除签名配置，防止 release 模式报错
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入稳定生产配置：开启压缩，但关闭不稳定的资源精简 (防止 IndexOutOfBounds 崩溃)
          # 显式关闭 debuggable 以确保 R8 执行真正的混淆
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“保命级”混淆规则 (解决闪退的核心)
          cat <<EOF > app/proguard-rules.pro
          # 关闭激进优化，确保老旧电视硬件兼容
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 保护 Python 运行时 (Chaquopy) - 核心逻辑不可混淆
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 修复闪退核心：保护所有 com.fongmi 包下的类 (投屏、UI、解析)
          # 这样就不会出现 "class te1" 这种找不到类名的报错
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          
          # 修复反射构造报错：强制保留所有单字符串和 Context 参数的构造函数
          -keepclassmembers class * {
              public <init>(java.lang.String);
              public <init>(android.content.Context, android.util.AttributeSet);
          }
          
          # 保护 TVBox 数据模型与 JS 桥接，防止视频源解析失败
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          # 忽略第三方库的细碎警告
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 配置环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建生产版本
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Final_Stable_Release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
