name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与 R8 稳定性手术
        run: |
          # 1. 移除签名配置
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 核心修改：关闭 shrinkResources 以修复 IndexOutOfBoundsException
          # 强制关闭 debuggable 并开启混淆
          sed -i '/buildTypes {/a \        all { \n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“稳定版”混淆规则，修复 R8 崩溃
          cat <<EOF > app/proguard-rules.pro
          # 关闭激进优化，防止 R8 内部索引报错
          -dontoptimize
          -dontpreverify
          
          # 必须保留 Python 接口 (Chaquopy)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 修复投屏服务崩溃 (DLNA)
          -keep class com.fongmi.android.tv.** { *; }
          -keep interface com.fongmi.android.tv.** { *; }
          -keepclassmembers class * {
              public <init>(java.lang.String);
          }
          
          # 保留 TVBox 数据模型
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 4. 校准环境
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 执行强力构建 (修复版)
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_R8_Fixed_Build
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
