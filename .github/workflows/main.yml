name: Build Android APK

on:
  workflow_dispatch:

# 强制使用 Node.js 24 以消除弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        # Chaquopy 编译环境必需
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 环境预处理与代码手术 (极致压缩与混淆)
        run: |
          # 1. 物理移除签名配置，彻底解决 null 报错
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 启用 MultiDex 并强制开启 R8 全量压缩与混淆
          sed -i 's/multiDexEnabled false/multiDexEnabled true/g' app/build.gradle
          
          # 3. 注入混淆与资源压缩配置，减少方法数以缩减 DEX 数量
          sed -i '/debug {/a \            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' app/build.gradle
          
          # 4. 写入保护规则，确保混淆后核心功能不闪退
          cat <<EOF > app/proguard-rules.pro
          -optimizationpasses 5
          -allowaccessmodification
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          -keep class com.github.tvbox.osc.bean.** { *; }
          -keep class com.github.tvbox.osc.util.js.** { *; }
          -keepclasseswithmembernames class * { native <methods>; }
          -dontnote **
          -dontwarn **
          -ignorewarnings
          EOF
          
          # 5. 指定 Python 路径和 SDK 路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建
        # 编译所有 debug 变体
        run: ./gradlew assembleDebug --no-daemon

      - name: 整理并上传多个独立 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Individual_APKs
          # 关键：path 指向所有生成的 APK 文件
          # upload-artifact v4 会将匹配到的多个文件列出
          path: |
            app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          # 设置不自动压缩（虽然 v4 默认行为有所改变，但这样能确保文件结构清晰）
          compression-level: 0
