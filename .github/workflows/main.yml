name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生产环境极致精简手术 (不混淆版)
        run: |
          # 1. 物理移除签名配置，确保构建顺利
          perl -0777 -i -pe 's/signingConfigs\s*\{.*?\}\s*\}\s*//gs' app/build.gradle
          sed -i '/signingConfig/d' app/build.gradle
          
          # 2. 注入生产环境配置：开启压缩，强制关闭混淆
          # 这样 R8 只会删掉没用的代码（减小 DEX 数量），但不会改名字（防止闪退）
          sed -i '/release {/,/}/c\        release {\n            debuggable false\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n        }' app/build.gradle
          
          # 3. 写入“只压缩不混淆”规则
          cat <<EOF > app/proguard-rules.pro
          # 关键指令：禁止混淆类名和方法名
          -dontobfuscate
          
          # 基础稳定性设置
          -dontoptimize
          -dontpreverify
          -ignorewarnings
          
          # 保护 Python 运行时 (Chaquopy)
          -keep class com.chaquo.python.** { *; }
          -keepattributes *Annotation*, EnclosingMethod, InnerClasses, Signature, SourceFile, LineNumberTable
          
          # 保护所有业务代码，防止被误删
          -keep class com.fongmi.android.tv.** { *; }
          -keep class com.github.tvbox.osc.** { *; }
          
          -dontnote **
          -dontwarn **
          EOF
          
          # 4. 配置环境路径
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python.path=$PYTHON_PATH" >> local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 强力构建生产版本
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_Lite_NoObfuscate
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
